    (function () {
      try {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        if (!ctx) return;

        ctx.fillStyle = '#091021';
        ctx.beginPath();
        ctx.roundRect(0, 0, 64, 64, 16);
        ctx.fill();

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(12, 20);
        ctx.lineTo(24, 46);
        ctx.lineTo(36, 22);
        ctx.lineTo(46, 38);
        ctx.lineTo(54, 18);
        ctx.stroke();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(12, 20);
        ctx.lineTo(24, 46);
        ctx.lineTo(36, 22);
        ctx.stroke();

        const dataUrl = c.toDataURL('image/png');
        window.__VYN_ICON_URL__ = dataUrl;

        const link = document.getElementById('faviconLink');
        if (link) link.href = dataUrl;
      } catch {}
    })();

      border-color: rgba(255, 255, 255, 0.75);

      border-color: #ffffff;

      transition: max-width 0.2s ease, padding 0.2s ease;

    @keyframes msgEnter {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    .msg {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 80%;
      line-height: 1.5;
      user-select: text;

      animation: msgEnter 0.2s cubic-bezier(0.22, 1, 0.36, 1);

    .msg-text {
      white-space: pre-wrap;
    }

      border-bottom-left-radius: 4px;

    @keyframes typingWave {

      }
      30% {
        transform: translateY(-6px) scale(1.15);

      animation-delay: 0s;

      overflow: hidden;

      display: flex;
      align-items: center;
      gap: 8px;
      transition: max-width 0.2s ease;

    #bar {
      flex: 1;
      min-width: 0;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 26px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, box-shadow 0.2s, padding 0.2s ease;
    }
    #bar:focus-within {
      border-color: var(--accent-1);
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.45);

### Neler Kaldırıldı & Neler Korundu?
* **Kaldırılanlar:** Üst menüdeki `Voice chat with Vyn AI` butonu, tam ekran sesli sohbet penceresi (`#voiceOverlay`), `SpeechRecognition` ve `speechSynthesis` ses/mikrofon kodlarının tamamı çıkarıldı.
* **Korunanlar:** 4 tema (`Kozmik`, `Siber Mavi`, `Süpernova Mor`, `Zümrüt`), `PC Mod` / `Mobil Mod`, `Türkçe` / `English` / `Français` / `Español` / `All` dil seçenekleri, 3 düşünme modu (`Hızlı`, `Mantıklı`, `Planlı`), başlangıç kartları, kopyalama butonu, `Durdur` butonu, sohbeti `.txt` indirme ve `Yeni Sohbet` butonları eksiksiz duruyor.

        opacity: 1;
      }

      0%, 100% { opacity: 0.68; }

      gap: 9px;

      display: inline-flex;
      align-items: center;
      gap: 5px;

      height: 19px;
      fill: currentColor;

    .think-modes {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      padding: 5px 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);

    }
    .think-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;

      border-radius: 999px;

      white-space: nowrap;

    }
    .think-btn:hover {
      color: #ffffff;
      background: rgba(148, 163, 184, 0.15);
    }
    .think-btn.active {
      color: #ffffff;
      background: var(--active-grad);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.45);
    }

    /* Ergonomik PC Mod */
    body.mode-pc #chat {
      max-width: 980px;
      padding: 24px 28px 16px;
      gap: 14px;
    }
    body.mode-pc #starter-cards,
    body.mode-pc .composer-row {
      max-width: 960px;
    }
    body.mode-pc #bar {
      padding: 10px 12px 10px 22px;
      border-radius: 28px;
    }
    body.mode-pc #inp {
      font-size: 1.03rem;
    }

    /* Ergonomik Mobil Mod */
    body.mode-mobile header {
      padding: 10px 12px;
      gap: 8px;
    }
    body.mode-mobile .header-sub {
      display: none;
    }
    body.mode-mobile #chat {
      max-width: 460px;
      padding: 14px 12px 10px;
      gap: 10px;
    }
    body.mode-mobile .msg {
      max-width: 90%;
      padding: 11px 14px;
      font-size: 0.96rem;
    }
    body.mode-mobile #bar-wrap {
      padding: 6px 12px 14px;
      gap: 8px;
    }
    body.mode-mobile #starter-cards {
      max-width: 460px;
      grid-template-columns: 1fr;
      gap: 7px;
    }
    body.mode-mobile .starter-card {
      padding: 8px 11px;
      border-radius: 14px;
    }
    body.mode-mobile .composer-row {
      max-width: 460px;
      flex-direction: column;
      align-items: stretch;
      gap: 7px;
    }
    body.mode-mobile .think-modes {
      justify-content: center;
    }
    body.mode-mobile #bar {
      padding: 7px 9px 7px 15px;
      border-radius: 22px;
    }
    body.mode-mobile #sendBtn {
      width: 44px;
      height: 44px;
    }

    @media (max-width: 680px) {
      #starter-cards {
        grid-template-columns: 1fr;
      }
      .msg {
        max-width: 90%;
      }
      .composer-row {
        flex-direction: column;
        align-items: stretch;
        gap: 7px;
      }
      .think-modes {
        justify-content: center;
      }
    }
  </style>
</head>

    function buildLockedHistory(lang) {
      const ui = langUI[lang] || langUI.tr;
      if (lang === 'all') {
        return chatHistory.map(item => ({
          role: item.role,
          text: item.text
        }));
      }
      const lockPrefix = `[Reply ONLY in ${ui.langName}] `;
      return chatHistory.map(item => ({
        role: item.role,
        text: item.role === 'user' ? `${lockPrefix}${item.text}` : item.text
      }));
    }

    function updateThinkingButtonsUI() {
      const ui = langUI[currentLang] || langUI.tr;
      thinkButtons.forEach(btn => {
        const mode = btn.dataset.think;
        btn.classList.toggle('active', mode === currentThinkingMode);
        if (ui.thinkLabels && ui.thinkLabels[mode]) {
          btn.textContent = ui.thinkLabels[mode];
        }
      });
    }

    function setThinkingMode(mode) {
      const allowed = ['fast', 'logical', 'planned'];
      currentThinkingMode = allowed.includes(mode) ? mode : 'logical';
      updateThinkingButtonsUI();
    }

    function syncSendButtonState() {
      const ui = langUI[currentLang] || langUI.tr;
      if (isGeneratingReply) {
        sendBtn.classList.add('is-generating');
        sendBtn.title = ui.stopTitle;
        sendBtn.setAttribute('aria-label', ui.stopTitle);
        sendBtnIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2.2"/>';
      } else {
        sendBtn.classList.remove('is-generating');
        sendBtn.title = ui.sendTitle;
        sendBtn.setAttribute('aria-label', ui.sendTitle);
        sendBtnIcon.innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
      }
    }

    function setTheme(themeName) {
      const allowed = ['cosmic', 'cyber', 'nova', 'emerald'];
      currentTheme = allowed.includes(themeName) ? themeName : 'cosmic';
      document.body.setAttribute('data-theme', currentTheme);
      themeSwatches.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === currentTheme);
      });
    }

    function setDeviceMode(mode) {
      currentDevice = mode === 'mobile' ? 'mobile' : 'pc';
      document.body.classList.toggle('mode-pc', currentDevice === 'pc');
      document.body.classList.toggle('mode-mobile', currentDevice === 'mobile');
      pcModeBtn.classList.toggle('active', currentDevice === 'pc');
      mobileModeBtn.classList.toggle('active', currentDevice === 'mobile');
    }

    function updateStarterCardsUI() {
      const ui = langUI[currentLang] || langUI.tr;
      ui.cards.forEach((card, idx) => {
        const titleEl = document.getElementById('cardTitle' + idx);
        const descEl = document.getElementById('cardDesc' + idx);
        if (titleEl) titleEl.textContent = card.title;
        if (descEl) descEl.textContent = card.desc;
      });
    }

    function useStarter(index) {
      const ui = langUI[currentLang] || langUI.tr;
      const card = ui.cards[index];
      if (!card) return;
      inp.value = card.prompt;
      autoResize(inp);
      inp.focus();
    }

    function refreshCopyButtons() {
      const ui = langUI[currentLang] || langUI.tr;
      document.querySelectorAll('.copy-btn').forEach(btn => {
        if (!btn.classList.contains('copied')) {
          btn.textContent = ui.copy;
        }
      });
    }

    function renderWelcomeBubble() {
      const ui = langUI[currentLang] || langUI.tr;
      chat.innerHTML = '';
      const d = document.createElement('div');
      d.id = 'welcomeMsg';
      d.className = 'msg ai';

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      textDiv.textContent = ui.welcome;
      d.appendChild(textDiv);

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = ui.copy;
      copyBtn.onclick = function () { copyBubbleText(this); };
      d.appendChild(copyBtn);

      chat.appendChild(d);
    }

    function downloadChatTxt() {
      const lines = ['VYN AI - Sohbet Kaydı', '========================', ''];
      const welcomeEl = document.querySelector('#welcomeMsg .msg-text');
      if (welcomeEl && welcomeEl.textContent) {
        lines.push(`VYN AI: ${welcomeEl.textContent}`, '');
      }
      for (const item of chatHistory) {
        const who = item.role === 'user' ? 'Sen' : 'VYN AI';
        lines.push(`${who}: ${item.text}`, '');
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vyn-ai-sohbet-${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function resetChat() {
      if (activeAbortController) {
        activeAbortController.abort();
        activeAbortController = null;
      }
      isGeneratingReply = false;
      syncSendButtonState();
      chatHistory.length = 0;
      inp.value = '';
      inp.style.height = 'auto';
      renderWelcomeBubble();
    }

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === 'all' ? 'en' : lang;
      const ui = langUI[lang] || langUI.tr;

      langButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      headerSub.textContent = ui.subtitle;
      themesLabel.textContent = ui.themes;
      pcModeLabel.textContent = ui.pcMode;
      mobileModeLabel.textContent = ui.mobileMode;
      downloadChatBtn.textContent = ui.downloadChat;
      newChatBtn.textContent = ui.newChat;
      inp.placeholder = ui.placeholder;

      const welcomeText = document.querySelector('#welcomeMsg .msg-text');
      if (welcomeText) {
        welcomeText.textContent = ui.welcome;
      }
      updateStarterCardsUI();
      updateThinkingButtonsUI();
      refreshCopyButtons();
      syncSendButtonState();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onPrimaryAction();
      }
    }

    function onPrimaryAction() {
      if (isGeneratingReply && activeAbortController) {
        activeAbortController.abort();
        return;
      }
      sendMsg();
    }

    async function copyBubbleText(btn) {
      const ui = langUI[currentLang] || langUI.tr;
      const bubble = btn.closest('.msg');
      const textEl = bubble ? bubble.querySelector('.msg-text') : null;
      const text = textEl ? textEl.textContent : '';
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = ui.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = (langUI[currentLang] || langUI.tr).copy;
        }, 1500);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        btn.textContent = ui.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = (langUI[currentLang] || langUI.tr).copy;
        }, 1500);
      }
    }

    function addBubble(text, cls, withCopy = false) {
      const ui = langUI[currentLang] || langUI.tr;
      const d = document.createElement('div');
      d.className = 'msg ' + cls;

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      textDiv.textContent = text;
      d.appendChild(textDiv);

      if (withCopy) {
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = ui.copy;
        copyBtn.onclick = function () { copyBubbleText(this); };
        d.appendChild(copyBtn);
      }

      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return textDiv;
    }

    function addTypingBubble(labelText) {
      const ui = langUI[currentLang] || langUI.tr;
      const d = document.createElement('div');
      d.className = 'msg ai';

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';

      const wrap = document.createElement('span');
      wrap.className = 'typing-wrap';

      const dots = document.createElement('span');
      dots.className = 'typing-dots';
      dots.setAttribute('aria-hidden', 'true');
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('span');
        dot.className = 'typing-dot';
        dots.appendChild(dot);
      }

      const lbl = document.createElement('span');
      lbl.className = 'typing-label';
      lbl.textContent = labelText;

      wrap.appendChild(dots);
      wrap.appendChild(lbl);
      textDiv.appendChild(wrap);
      d.appendChild(textDiv);

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = ui.copy;
      copyBtn.onclick = function () { copyBubbleText(this); };
      d.appendChild(copyBtn);

      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return textDiv;
    }

    async function sendMsg() {
      const q = inp.value.trim();
      if (!q || isGeneratingReply) return;

      const ui = langUI[currentLang] || langUI.tr;
      const modeInstruction =
        (ui.thinkInstructions && ui.thinkInstructions[currentThinkingMode]) || '';
      const langRule = ui.langLockRule || '';
      const lockedHistory = buildLockedHistory(currentLang);
      const outboundMessage = [langRule, `User message: ${q}`, modeInstruction]
        .filter(Boolean)
        .join('\n\n');

      addBubble(q, 'user', false);
      chatHistory.push({ role: 'user', text: q });
      inp.value = '';
      inp.style.height = 'auto';

      const waitText = addTypingBubble(ui.thinking);
      activeAbortController = new AbortController();
      isGeneratingReply = true;
      syncSendButtonState();

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: activeAbortController.signal,
          body: JSON.stringify({
            message: outboundMessage,
            rawMessage: q,
            history: lockedHistory,
            lang: currentLang,
            forceLang: currentLang === 'all' ? 'auto' : currentLang,
            targetLanguage: ui.langName,
            thinkingMode: currentThinkingMode
          })
        });
        const data = await r.json();

        if (r.ok && data.reply) {
          waitText.textContent = data.reply;
          chatHistory.push({ role: 'assistant', text: data.reply });
        } else {
          waitText.textContent = data.error || ui.error;
          chatHistory.pop();
        }
      } catch (err) {
        if (err && err.name === 'AbortError') {
          waitText.textContent = ui.stoppedMsg;
          chatHistory.pop();
        } else {
          waitText.textContent = ui.netErr;
          chatHistory.pop();
        }
      } finally {
        activeAbortController = null;
        isGeneratingReply = false;
        syncSendButtonState();
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>
