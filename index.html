<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYN AI</title>
  <link id="faviconLink" rel="icon" type="image/png" href="" />
  <script>
    (function () {
      try {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        if (!ctx) return;

        ctx.fillStyle = '#091021';
        ctx.beginPath();
        ctx.roundRect(0, 0, 64, 64, 16);
        ctx.fill();

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(12, 20);
        ctx.lineTo(24, 46);
        ctx.lineTo(36, 22);
        ctx.lineTo(46, 38);
        ctx.lineTo(54, 18);
        ctx.stroke();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(12, 20);
        ctx.lineTo(24, 46);
        ctx.lineTo(36, 22);
        ctx.stroke();

        const link = document.getElementById('faviconLink');
        if (link) link.href = c.toDataURL('image/png');
      } catch {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.22), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.16), transparent 45%),
        linear-gradient(160deg, #070b14 0%, #0f172a 55%, #091021 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-right: 4px;
    }
    .brand-logo {
      display: block;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
    }
    .lang-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .lang-label {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
      padding-left: 4px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .lang-btn:hover {
      color: #ffffff;
      background: rgba(148, 163, 184, 0.14);
    }
    .lang-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .header-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .action-pill-btn {
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(30, 41, 59, 0.75);
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .action-pill-btn:hover {
      color: #ffffff;
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.65);
    }
    .action-pill-btn.active-mode {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-color: transparent;
      box-shadow: 0 2px 12px rgba(124, 58, 237, 0.4);
    }
    .chess-pill-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 80%;
      line-height: 1.5;
      user-select: text;
      -webkit-user-select: text;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .user {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }
    .ai {
      background: rgba(30, 41, 59, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .copy-btn {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .copy-btn:hover {
      color: #ffffff;
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
    }
    .copy-btn.copied {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.65);
    }

    /* Satranç Oyun Modal / Panel */
    #chessOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(5, 8, 17, 0.78);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #chessOverlay.open {
      display: flex;
    }
    #chessModal {
      width: 100%;
      max-width: 740px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chess-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chess-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chess-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(168, 85, 247, 0.28));
      border: 1px solid rgba(148, 163, 184, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .chess-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .chess-sub {
      font-size: 0.76rem;
      color: #94a3b8;
    }
    .chess-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chess-btn {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .chess-btn:hover {
      border-color: rgba(56, 189, 248, 0.6);
      color: #ffffff;
      background: rgba(56, 189, 248, 0.16);
    }
    .chess-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 16px;
      align-items: start;
    }
    .chess-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(148, 163, 184, 0.28);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
    .sq {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.45rem, 4.2vw, 2.35rem);
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background 0.12s ease, transform 0.1s ease;
    }
    .sq.light {
      background: #cbd5e1;
      color: #0f172a;
    }
    .sq.dark {
      background: #334155;
      color: #f8fafc;
    }
    .sq.selected {
      outline: 3px solid #38bdf8;
      outline-offset: -3px;
      background: rgba(56, 189, 248, 0.45) !important;
    }
    .sq.last-move {
      background: rgba(168, 85, 247, 0.34) !important;
    }
    .sq.legal::after {
      content: "";
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.78);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    }
    .sq.legal.has-piece::after {
      width: 82%;
      height: 82%;
      background: transparent;
      border: 3px solid rgba(168, 85, 247, 0.9);
      box-shadow: none;
    }
    .chess-side {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chess-status {
      font-size: 0.84rem;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.4;
    }
    .chess-note {
      font-size: 0.74rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .chess-moves-box {
      background: rgba(9, 16, 33, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 12px;
      padding: 8px 10px;
      height: 170px;
      overflow-y: auto;
      font-size: 0.76rem;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* Modern Gemini Tarzı Alt Yazı Barı ve Başlangıç Kartları */
    #bar-wrap {
      padding: 6px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: linear-gradient(to top, rgba(7, 11, 20, 0.94) 65%, transparent);
    }
    #starter-cards {
      width: 100%;
      max-width: 780px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .starter-card {
      background: rgba(30, 41, 59, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 10px 12px;
      color: #e2e8f0;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.16s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    .starter-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.45);
    }
    .starter-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(168, 85, 247, 0.22));
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .starter-icon svg {
      width: 17px;
      height: 17px;
    }
    .starter-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .starter-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .starter-desc {
      font-size: 0.73rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #bar {
      width: 100%;
      max-width: 780px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 26px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #bar:focus-within {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 10px 32px rgba(56, 189, 248, 0.14);
    }
    #inp {
      flex: 1;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 1rem;
      line-height: 1.45;
      max-height: 140px;
      min-height: 26px;
      padding: 6px 0;
      resize: none;
      outline: none;
      overflow-y: auto;
    }
    #inp::placeholder {
      color: #94a3b8;
    }
    #sendBtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    #sendBtn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.45);
    }
    #sendBtn:active {
      transform: scale(0.95);
    }
    #sendBtn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    @media (max-width: 680px) {
      #starter-cards {
        grid-template-columns: 1fr;
      }
      .msg {
        max-width: 90%;
      }
      .chess-body {
        grid-template-columns: 1fr;
      }
      .chess-moves-box {
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand-wrap">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#091021" stroke="rgba(56,189,248,0.35)" stroke-width="2"/>
          <path d="M12 20 L24 46 L36 22 L46 38 L54 18" fill="none" stroke="#a855f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 20 L24 46 L36 22" fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 18 L26 36 L34 20" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        </svg>
        <span>VYN AI</span>
      </div>

      <div class="lang-box" role="group" aria-label="Language">
        <span class="lang-label">Language:</span>
        <button type="button" class="lang-btn active" data-lang="tr" onclick="setLang('tr')">Türkçe</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
        <button type="button" class="lang-btn" data-lang="fr" onclick="setLang('fr')">Français</button>
        <button type="button" class="lang-btn" data-lang="es" onclick="setLang('es')">Español</button>
      </div>
    </div>

    <div class="header-right">
      <button id="playGameBtn" type="button" class="action-pill-btn" onclick="toggleChessModal(true)">
        <svg class="chess-pill-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 20h10M9 17h6l-1-5 3-3-1-4-3 1-1-2-1 2-3-1-1 4 3 3-1 5Z" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="playGameLabel">Oyun Oyna</span>
      </button>
      <button id="newChatBtn" type="button" class="action-pill-btn" onclick="resetChat()">Yeni Sohbet</button>
      <div id="headerSub" class="header-sub">Sohbet, İşlem & Bilgi Asistanı</div>
    </div>
  </header>

  <div id="chat">
    <div id="welcomeMsg" class="msg ai">
      <div class="msg-text">Selam! Ben VYN AI. Sohbet edebilir, işlem yaptırabilir veya merak ettiğin konuları sorabilirsin.</div>
      <button type="button" class="copy-btn" onclick="copyBubbleText(this)">Kopyala</button>
    </div>
  </div>

  <div id="chessOverlay" role="dialog" aria-modal="true" aria-labelledby="chessModalTitle">
    <div id="chessModal">
      <div class="chess-top">
        <div class="chess-title-wrap">
          <div class="chess-badge" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M6 19h12M8 16h8l-1-4.5 2.5-2.5L16 5l-2.5 1L12 3.5 10.5 6 8 5l-1.5 4L9 11.5 8 16Z" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="10" r="1.3" fill="#a855f7"/>
            </svg>
          </div>
          <div>
            <div id="chessModalTitle" class="chess-title">VYN AI Satranç</div>
            <div id="chessModalSub" class="chess-sub">Sen Beyaz · VYN AI Siyah</div>
          </div>
        </div>
        <div class="chess-controls">
          <button id="chessRestartBtn" type="button" class="chess-btn" onclick="initChessGame()">Yeni Oyun</button>
          <button id="chessCloseBtn" type="button" class="chess-btn" onclick="toggleChessModal(false)">Kapat</button>
        </div>
      </div>

      <div class="chess-body">
        <div id="chessBoard" class="chess-board" aria-label="Chess Board"></div>
        <div class="chess-side">
          <div id="chessStatus" class="chess-status">Sıra sende (Beyaz)</div>
          <div id="chessNote" class="chess-note">Bir taşı seçip hedef kareye tıkla. VYN AI hamleni görünce sırasını oynayacak.</div>
          <div id="chessMoves" class="chess-moves-box"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="bar-wrap">
    <div id="starter-cards" aria-label="Starter Prompts">
      <button type="button" class="starter-card" onclick="useStarter(0)">
        <span class="starter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12a7 7 0 0 1 14 0c0 3.2-2.2 5.8-5.2 6.6L10 21v-2.7C7 17.5 5 15 5 12Z" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="9.5" cy="11.5" r="1" fill="#a855f7"/>
            <circle cx="14.5" cy="11.5" r="1" fill="#38bdf8"/>
          </svg>
        </span>
        <span class="starter-meta">
          <span id="cardTitle0" class="starter-title">Serbest Sohbet</span>
          <span id="cardDesc0" class="starter-desc">Günün nasıl geçiyor? Bana bir fikir anlat.</span>
        </span>
      </button>

      <button type="button" class="starter-card" onclick="useStarter(1)">
        <span class="starter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3l1.9 4.4L18.5 9l-4.6 1.6L12 15l-1.9-4.4L5.5 9l4.6-1.6L12 3Z" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/>
            <path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="starter-meta">
          <span id="cardTitle1" class="starter-title">Hızlı Bilgi</span>
          <span id="cardDesc1" class="starter-desc">Karmaşık bir konuyu sade şekilde açıkla.</span>
        </span>
      </button>

      <button type="button" class="starter-card" onclick="useStarter(2)">
        <span class="starter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="6" cy="18" r="2.2" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="18" cy="6" r="2.2" stroke="#a855f7" stroke-width="2"/>
            <path d="M8.2 18H12a4 4 0 0 0 4-4v-1.5a4 4 0 0 1 2-3.5" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="starter-meta">
          <span id="cardTitle2" class="starter-title">Strateji & Plan</span>
          <span id="cardDesc2" class="starter-desc">Hedefin için net bir strateji ve yol haritası çıkar.</span>
        </span>
      </button>
    </div>

    <div id="bar">
      <textarea id="inp" rows="1" placeholder="VYN AI'a bir şey sor..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" type="button" onclick="sendMsg()" title="Gönder" aria-label="Gönder">
        <svg viewBox="0 0 24 24">

    /* ================= SATRANÇ MOTORU (VYN AI SİYAH, KULLANICI BEYAZ) ================= */
    const PIECE_GLYPHS = {
      wK: '♔', wQ: '♕', wR: '♖', wB: '♗', wN: '♘', wP: '♙',
      bK: '♚', bQ: '♛', bR: '♜', bB: '♝', bN: '♞', bP: '♟'
    };
    const PIECE_VALUES = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };
    const FILES = 'abcdefgh';

    let chessBoard = [];
    let chessTurn = 'w';
    let chessSelected = null;
    let chessLegalMoves = [];
    let chessLastMove = null;
    let chessMoveLog = [];
    let chessGameOver = null; // 'mate_w' | 'mate_b' | 'stalemate' | null

    function initChessGame() {
      const backRank = ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'];
      chessBoard = Array.from({ length: 8 }, () => Array(8).fill(null));
      for (let c = 0; c < 8; c++) {
        chessBoard[0][c] = 'b' + backRank[c];
        chessBoard[1][c] = 'bP';
        chessBoard[6][c] = 'wP';
        chessBoard[7][c] = 'w' + backRank[c];
      }
      chessTurn = 'w';
      chessSelected = null;
      chessLegalMoves = [];
      chessLastMove = null;
      chessMoveLog = [];

      document.getElementById('chessMoves').textContent = '';
      updateChessStatusText();
      renderChessBoard();
    }

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function pieceColor(p) {
      return p ? p[0] : null;
    }

    function pieceType(p) {
      return p ? p[1] : null;
    }

    function coordToAlg(r, c) {
      return FILES[c] + (8 - r);
    }

    function algToCoord(alg) {
      if (!alg || typeof alg !== 'string') return null;
      const clean = alg.trim().toLowerCase().replace(/[^a-h1-8]/g, '');
      if (clean.length < 2) return null;
      const c = FILES.indexOf(clean[0]);
      const r = 8 - parseInt(clean[1], 10);
      if (!inBounds(r, c)) return null;
      return { r, c };
    }

    function findKing(board, color) {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (board[r][c] === color + 'K') return { r, c };
        }
      }
      return null;
    }

    function isSquareAttacked(board, r, c, byColor) {
      const pawnDir = byColor === 'w' ? -1 : 1;
      for (const dc of [-1, 1]) {
        const pr = r - pawnDir;
        const pc = c + dc;
        if (inBounds(pr, pc) && board[pr][pc] === byColor + 'P') return true;
      }

      const knightJumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for (const [dr, dc] of knightJumps) {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && board[nr][nc] === byColor + 'N') return true;
      }

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const kr = r + dr, kc = c + dc;
          if (inBounds(kr, kc) && board[kr][kc] === byColor + 'K') return true;
        }
      }

      const ortho = [[-1,0],[1,0],[0,-1],[0,1]];
      for (const [dr, dc] of ortho) {
        let nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc)) {
          const p = board[nr][nc];
          if (p) {
            if (pieceColor(p) === byColor && (pieceType(p) === 'R' || pieceType(p) === 'Q')) return true;
            break;
          }
          nr += dr; nc += dc;
        }
      }

      const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
      for (const [dr, dc] of diag) {
        let nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc)) {
          const p = board[nr][nc];
          if (p) {
            if (pieceColor(p) === byColor && (pieceType(p) === 'B' || pieceType(p) === 'Q')) return true;
            break;
          }
          nr += dr; nc += dc;
        }
      }

      return false;
    }

    function isInCheck(board, color) {
      const kingPos = findKing(board, color);
      if (!kingPos) return false;
      const enemy = color === 'w' ? 'b' : 'w';
      return isSquareAttacked(board, kingPos.r, kingPos.c, enemy);
    }

    function cloneBoard(board) {
      return board.map(row => row.slice());
    }

    function applyMoveOnBoard(board, rights, move) {
      const next = cloneBoard(board);
      const nextRights = { ...rights };
      const piece = next[move.fr][move.fc];
      const color = pieceColor(piece);
      const type = pieceType(piece);

      next[move.fr][move.fc] = null;
      next[move.tr][move.tc] = piece;

      if (type === 'K' && Math.abs(move.tc - move.fc) === 2) {
        if (move.tc === 6) {
          next[move.fr][5] = next[move.fr][7];
          next[move.fr][7] = null;
        } else if (move.tc === 2) {
          next[move.fr][3] = next[move.fr][0];
          next[move.fr][0] = null;
        }
      }

      if (type === 'P' && (move.tr === 0 || move.tr === 7)) {
        next[move.tr][move.tc] = color + 'Q';
      }

      if (type === 'K') {
        nextRights[color + 'K'] = false;
        nextRights[color + 'Q'] = false;
      }
      if (type === 'R') {
        if (move.fr === 7 && move.fc === 0) nextRights.wQ = false;
        if (move.fr === 7 && move.fc === 7) nextRights.wK = false;
        if (move.fr === 0 && move.fc === 0) nextRights.bQ = false;
        if (move.fr === 0 && move.fc === 7) nextRights.bK = false;
      }
      if (move.tr === 7 && move.tc === 0) nextRights.wQ = false;
      if (move.tr === 7 && move.tc === 7) nextRights.wK = false;
      if (move.tr === 0 && move.tc === 0) nextRights.bQ = false;
      if (move.tr === 0 && move.tc === 7) nextRights.bK = false;

      return { board: next, rights: nextRights };
    }

    function generateLegalMoves(color, board = chessBoard, rights = castlingRights) {
      const pseudo = [];
      const enemy = color === 'w' ? 'b' : 'w';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p || pieceColor(p) !== color) continue;
          const t = pieceType(p);

          if (t === 'P') {
            const dir = color === 'w' ? -1 : 1;
            const startRow = color === 'w' ? 6 : 1;
            if (inBounds(r + dir, c) && !board[r + dir][c]) {
              pseudo.push({ fr: r, fc: c, tr: r + dir, tc: c });
              if (r === startRow && !board[r + dir * 2][c]) {
                pseudo.push({ fr: r, fc: c, tr: r + dir * 2, tc: c });
              }
            }
            for (const dc of [-1, 1]) {
              const nr = r + dir, nc = c + dc;
              if (inBounds(nr, nc) && board[nr][nc] && pieceColor(board[nr][nc]) === enemy) {
                pseudo.push({ fr: r, fc: c, tr: nr, tc: nc });
              }
            }
          } else if (t === 'N') {
            for (const [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
              const nr = r + dr, nc = c + dc;
              if (inBounds(nr, nc) && pieceColor(board[nr][nc]) !== color) {
                pseudo.push({ fr: r, fc: c, tr: nr, tc: nc });
              }
            }
          } else if (t === 'K') {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr, nc = c + dc;
                if (inBounds(nr, nc) && pieceColor(board[nr][nc]) !== color) {
                  pseudo.push({ fr: r, fc: c, tr: nr, tc: nc });
                }
              }
            }
            const baseRow = color === 'w' ? 7 : 0;
            if (r === baseRow && c === 4 && !isInCheck(board, color)) {
              if (rights[color + 'K'] && !board[baseRow][5] && !board[baseRow][6] &&
                  !isSquareAttacked(board, baseRow, 5, enemy) && !isSquareAttacked(board, baseRow, 6, enemy) &&
                  board[baseRow][7] === color + 'R') {
                pseudo.push({ fr: baseRow, fc: 4, tr: baseRow, tc: 6 });
              }
              if (rights[color + 'Q'] && !board[baseRow][3] && !board[baseRow][2] && !board[baseRow][1] &&
                  !isSquareAttacked(board, baseRow, 3, enemy) && !isSquareAttacked(board, baseRow, 2, enemy) &&
                  board[baseRow][0] === color + 'R') {
                pseudo.push({ fr: baseRow, fc: 4, tr: baseRow, tc: 2 });
              }
            }
          } else {
            const dirs = [];
            if (t === 'R' || t === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
            if (t === 'B' || t === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
            for (const [dr, dc] of dirs) {
              let nr = r + dr, nc = c + dc;
              while (inBounds(nr, nc)) {
                const target = board[nr][nc];
                if (!target) {
                  pseudo.push({ fr: r, fc: c, tr: nr, tc: nc });
                } else {
                  if (pieceColor(target) !== color) {
                    pseudo.push({ fr: r, fc: c, tr: nr, tc: nc });
                  }
                  break;
                }
                nr += dr; nc += dc;
              }
            }
          }
        }
      }

      const legal = [];
      for (const m of pseudo) {
        const sim = applyMoveOnBoard(board, rights, m);
        if (!isInCheck(sim.board, color)) {
          legal.push(m);
        }
      }
      return legal;
    }

    function boardToFen(board = chessBoard, turn = chessTurn) {
      const rows = board.map(row => {
        let empty = 0;
        let out = '';
        for (const cell of row) {
          if (!cell) {
            empty++;
          } else {
            if (empty > 0) { out += empty; empty = 0; }
            const col = cell[0];
            const typ = cell[1];
            out += col === 'w' ? typ.toUpperCase() : typ.toLowerCase();
          }
        }
        if (empty > 0) out += empty;
        return out;
      });
      return `${rows.join('/')} ${turn}`;
    }

    function updateChessStatusText() {
      const ui = langUI[currentLang] || langUI.tr;
      const el = document.getElementById('chessStatus');
      if (!el) return;
      if (chessGameOver === 'mate_w') {
        el.textContent = ui.chessMateWhite;
      } else if (chessGameOver === 'mate_b') {
        el.textContent = ui.chessMateBlack;
      } else if (chessGameOver === 'stalemate') {
        el.textContent = ui.chessStalemate;
      } else if (chessTurn === 'w') {
        el.textContent = isInCheck(chessBoard, 'w') ? ui.chessCheckWhite : ui.chessTurnWhite;
      } else {
        el.textContent = isInCheck(chessBoard, 'b') ? ui.chessCheckBlack : ui.chessTurnBlack;
      }
    }

    function appendMoveToLog(who, move) {
      const label = `${who}: ${coordToAlg(move.fr)}-${coordToAlg(move.tr)}`;
      chessMoveLog.push(label);
      const box = document.getElementById('chessMoves');
      box.textContent = chessMoveLog.join('\n');
      box.scrollTop = box.scrollHeight;
    }

    function renderChessBoard() {
      const boardEl = document.getElementById('chessBoard');
      boardEl.innerHTML = '';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('button');
          sq.type = 'button';
          const isLight = (r + c) % 2 === 0;
          sq.className = 'sq ' + (isLight ? 'light' : 'dark');

          if (chessSelected && chessSelected.r === r && chessSelected.c === c) {
            sq.classList.add('selected');
          }
          if (chessLastMove &&
              ((chessLastMove.fr === r && chessLastMove.fc === c) ||
               (chessLastMove.tr === r && chessLastMove.tc === c))) {
            sq.classList.add('last-move');
          }

          const isLegalTarget = chessLegalMoves.some(m => m.tr === r && m.tc === c);
          if (isLegalTarget) {
            sq.classList.add('legal');
            if (chessBoard[r][c]) sq.classList.add('has-piece');
          }

          const piece = chessBoard[r][c];
          if (piece) {
            sq.textContent = PIECE_GLYPHS[piece] || '';
          }

          sq.onclick = () => handleChessSquareClick(r, c);
          boardEl.appendChild(sq);
        }
      }
    }

    function checkAndHandleEndgame(nextTurn) {
      const legal = generateLegalMoves(nextTurn);
      if (legal.length === 0) {
        if (isInCheck(chessBoard, nextTurn)) {
          chessGameOver = nextTurn === 'w' ? 'mate_w' : 'mate_b';
        } else {
          chessGameOver = 'stalemate';
        }
        updateChessStatusText();
        return true;
      }
      return false;
    }

    function handleChessSquareClick(r, c) {
      if (chessGameOver || chessAiBusy || chessTurn !== 'w') return;

      const clickedPiece = chessBoard[r][c];
      const moveMatch = chessLegalMoves.find(m => m.tr === r && m.tc === c);

      if (moveMatch) {
        const sim = applyMoveOnBoard(chessBoard, castlingRights, moveMatch);
        chessBoard = sim.board;
        castlingRights = sim.rights;
        chessLastMove = moveMatch;
        chessSelected = null;
        chessLegalMoves = [];
        chessTurn = 'b';
        appendMoveToLog('Sen', moveMatch);
        updateChessStatusText();
        renderChessBoard();

        if (!checkAndHandleEndgame('b')) {
          triggerVynAiChessMove(moveMatch);
        }
        return;
      }

      if (clickedPiece && pieceColor(clickedPiece) === 'w') {
        if (chessSelected && chessSelected.r === r && chessSelected.c === c) {
          chessSelected = null;
          chessLegalMoves = [];
        } else {
          chessSelected = { r, c };
          chessLegalMoves = generateLegalMoves('w').filter(m => m.fr === r && m.fc === c);
        }
        renderChessBoard();
      } else {
        chessSelected = null;
        chessLegalMoves = [];
        renderChessBoard();
      }
    }

    function pickFallbackBlackMove(legalMoves) {
      let best = legalMoves[0];
      let bestScore = -999999;

      for (const m of legalMoves) {
        let score = Math.random() * 18;
        const target = chessBoard[m.tr][m.tc];
        if (target) {
          score += (PIECE_VALUES[pieceType(target)] || 100) * 1.1;
        }
        if (m.tr >= 3 && m.tr <= 4 && m.tc >= 3 && m.tc <= 4) {
          score += 22;
        }
        const sim = applyMoveOnBoard(chessBoard, castlingRights, m);
        if (isInCheck(sim.board, 'w')) {
          score += 35;
        }
        if (isSquareAttacked(sim.board, m.tr, m.tc, 'w')) {
          const movingPiece = sim.board[m.tr][m.tc];
          score -= (PIECE_VALUES[pieceType(movingPiece)] || 100) * 0.85;
        }
        if (score > bestScore) {
          bestScore = score;
          best = m;
        }
      }
      return best;
    }

    function parseAiMoveFromReply(replyText, legalMoves) {
      if (!replyText) return null;
      const tokens = replyText.match(/[a-h][1-8][-\s→>*x]*[a-h][1-8]/gi) || [];
      for (const tok of tokens) {
        const pair = tok.toLowerCase().match(/[a-h][1-8]/g);
        if (pair && pair.length >= 2) {
          const from = algToCoord(pair[0]);
          const to = algToCoord(pair[1]);
          if (from && to) {
            const matched = legalMoves.find(
              m => m.fr === from.r && m.fc === from.c && m.tr === to.r && m.tc === to.c
            );
            if (matched) return matched;
          }
        }
      }
      return null;
    }

    async function triggerVynAiChessMove(userMove) {
      const legalMoves = generateLegalMoves('b');
      if (legalMoves.length === 0) return;

      chessAiBusy = true;
      updateChessStatusText();

      const legalListStr = legalMoves
        .map(m => `${coordToAlg(m.fr)}${coordToAlg(m.tr)}`)
        .join(', ');
      const fen = boardToFen(chessBoard, 'b');
      const promptForAi =
        `Satranç oyunundayız. Sen SİYAH taşsın, kullanıcı BEYAZ taşla ${coordToAlg(userMove.fr)}${coordToAlg(userMove.tr)} oynadı. ` +
        `Güncel tahta (FEN): ${fen}. ` +
        `Geçerli siyah hamlelerin şunlar: [${legalListStr}]. ` +
        `Sadece bu listeden en iyi hamleyi seç ve cevabının başına hamleyi şu formatta yaz (örnek: e7e5):`;

      let chosenMove = null;
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: promptForAi,
            history: [],
            lang: currentLang
          })
        });
        if (r.ok) {
          const data = await r.json();
          chosenMove = parseAiMoveFromReply(data.reply, legalMoves);
        }
      } catch {}

      if (!chosenMove) {
        chosenMove = pickFallbackBlackMove(legalMoves);
      }

      const sim = applyMoveOnBoard(chessBoard, castlingRights, chosenMove);
      chessBoard = sim.board;
      castlingRights = sim.rights;
      chessLastMove = chosenMove;
      chessTurn = 'w';
      chessAiBusy = false;
      appendMoveToLog('VYN AI', chosenMove);
      checkAndHandleEndgame('w');
      updateChessStatusText();
      renderChessBoard();
    }

    updateChessTexts();
  </script>
