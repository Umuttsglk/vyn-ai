<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYN AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23091021'/%3E%3Cpath d='M12 20 L24 46 L36 22 L46 38 L54 18' fill='none' stroke='%23a855f7' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 20 L24 46 L36 22' fill='none' stroke='%2338bdf8' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 18 L26 36 L34 20' fill='none' stroke='%237dd3fc' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' opacity='0.85'/%3E%3C/svg%3E?v=2" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.22), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.16), transparent 45%),
        linear-gradient(160deg, #070b14 0%, #0f172a 55%, #091021 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-right: 4px;
    }
    .brand-logo {
      display: block;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
    }
    .lang-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .lang-label {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
      padding-left: 4px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .lang-btn:hover {
      color: #ffffff;
      background: rgba(148, 163, 184, 0.14);
    }
    .lang-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .header-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .new-chat-btn {
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(30, 41, 59, 0.75);
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .new-chat-btn:hover {
      color: #ffffff;
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.65);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 80%;
      line-height: 1.5;
      user-select: text;
      -webkit-user-select: text;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .user {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }
    .ai {
      background: rgba(30, 41, 59, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .copy-btn {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .copy-btn:hover {
      color: #ffffff;
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
    }
    .copy-btn.copied {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.65);
    }

    /* Modern Gemini Tarzı Alt Yazı Barı ve Başlangıç Kartları */
    #bar-wrap {
      padding: 6px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: linear-gradient(to top, rgba(7, 11, 20, 0.94) 65%, transparent);
    }
    #starter-cards {
      width: 100%;
      max-width: 780px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .starter-card {
      background: rgba(30, 41, 59, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 10px 12px;
      color: #e2e8f0;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.16s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    .starter-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.45);
    }
    .starter-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(168, 85, 247, 0.22));
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .starter-icon svg {
      width: 17px;
      height: 17px;
    }
    .starter-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .starter-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .starter-desc {
      font-size: 0.73rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #bar {
      width: 100%;
      max-width: 780px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 26px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #bar:focus-within {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 10px 32px rgba(56, 189, 248, 0.14);
    }
    #inp {
      flex: 1;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 1rem;
      line-height: 1.45;
      max-height: 140px;
      min-height: 26px;
      padding: 6px 0;
      resize: none;
      outline: none;
      overflow-y: auto;
    }
    #inp::placeholder {
      color: #94a3b8;
    }
    #sendBtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    #sendBtn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.45);
    }
    #sendBtn:active {
      transform: scale(0.95);
    }
    #sendBtn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    @media (max-width: 680px) {
      #starter-cards {
        grid-template-columns: 1fr;
      }
      .msg {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand-wrap">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#091021" stroke="rgba(56,189,248,0.35)" stroke-width="2"/>
          <path d="M12 20 L24 46 L36 22 L46 38 L54 18" fill="none" stroke="#a855f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 20 L24 46 L36 22" fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 18 L26 36 L34 20" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        </svg>
        <span>VYN AI</span>
      </div>

      <div class="lang-box" role="group" aria-label="Language">
        <span class="lang-label">Language:</span>
        <button type="button" class="lang-btn active" data-lang="tr" onclick="setLang('tr')">Türkçe</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
        <button type="button" class="lang-btn" data-lang="fr" onclick="setLang('fr')">Français</button>
        <button type="button" class="lang-btn" data-lang="es" onclick="setLang('es')">Español</button>
      </div>
    </div>

    <div class="header-right">
      <button id="newChatBtn" type="button" class="new-chat-btn" onclick="resetChat()">Yeni Sohbet</button>
      <div id="headerSub" class="header-sub">Sohbet, İşlem & Bilgi Asistanı</div>
    </div>
  </header>

  <div id="chat">
    <div id="welcomeMsg" class="msg ai">
      <div class="msg-text">Selam! Ben VYN AI. Sohbet edebilir, işlem yaptırabilir veya merak ettiğin konuları sorabilirsin.</div>
      <button type="button" class="copy-btn" onclick="copyBubbleText(this)">Kopyala</button>
    </div>
  </div>

  <div id="bar-wrap">
    <div id="starter-cards" aria-label="Starter Prompts">
      <button type="button" class="starter-card" onclick="useStarter(0)">
        <span class="starter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12a7 7 0 0 1 14 0c0 3.2-2.2 5.8-5.2 6.6L10 21v-2.7C7 17.5 5 15 5 12Z" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="9.5" cy="11.5" r="1" fill="#a855f7"/>
            <circle cx="14.5" cy="11.5" r="1" fill="#38bdf8"/>
          </svg>
        </span>
        <span class="starter-meta">
          <span id="cardTitle0" class="starter-title">Serbest Sohbet</span>
          <span id="cardDesc0" class="starter-desc">Günün nasıl geçiyor? Bana bir fikir anlat.</span>
        </span>
      </button>

      <button type="button" class="starter-card" onclick="useStarter(1)">
        <span class="starter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3l1.9 4.4L18.5 9l-4.6 1.6L12 15l-1.9-4.4L5.5 9l4.6-1.6L12 3Z" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/>
            <path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="starter-meta">
          <span id="cardTitle1" class="starter-title">Hızlı Bilgi</span>
          <span id="cardDesc1" class="starter-desc">Karmaşık bir konuyu sade şekilde açıkla.</span>
        </span>
      </button>

      <button type="button" class="starter-card" onclick="useStarter(2)">
        <span class="starter-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="6" cy="18" r="2.2" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="18" cy="6" r="2.2" stroke="#a855f7" stroke-width="2"/>
            <path d="M8.2 18H12a4 4 0 0 0 4-4v-1.5a4 4 0 0 1 2-3.5" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="starter-meta">
          <span id="cardTitle2" class="starter-title">Strateji & Plan</span>
          <span id="cardDesc2" class="starter-desc">Hedefin için net bir strateji ve yol haritası çıkar.</span>
        </span>
      </button>
    </div>

    <div id="bar">
      <textarea id="inp" rows="1" placeholder="VYN AI'a bir şey sor..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" type="button" onclick="sendMsg()" title="Gönder" aria-label="Gönder">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    const headerSub = document.getElementById('headerSub');
    const newChatBtn = document.getElementById('newChatBtn');
    const langButtons = document.querySelectorAll('.lang-btn');
    const chatHistory = [];
    let currentLang = 'tr';

    const langUI = {
      tr: {
        subtitle: "Sohbet, İşlem & Bilgi Asistanı",
        newChat: "Yeni Sohbet",
        welcome: "Selam! Ben VYN AI. Sohbet edebilir, işlem yaptırabilir veya merak ettiğin konuları sorabilirsin.",
        placeholder: "VYN AI'a bir şey sor...",
        thinking: "Düşünüyorum...",
        error: "Cevap alınamadı.",
        netErr: "Bağlantı hatası oldu.",
        copy: "Kopyala",
        copied: "Kopyalandı!",
        cards: [
          {
            title: "Serbest Sohbet",
            desc: "Günün nasıl geçiyor? Bana bir fikir anlat.",
            prompt: "Selam VYN AI! Bugün aklımdaki bir fikri seninle paylaşmak ve üzerine konuşmak istiyorum."
          },
          {
            title: "Hızlı Bilgi",
            desc: "Karmaşık bir konuyu sade şekilde açıkla.",
            prompt: "Bana yapay zekanın nasıl çalıştığını kısa, net ve sade örneklerle açıklar mısın?"
          },
          {
            title: "Strateji & Plan",
            desc: "Hedefin için net bir strateji ve yol haritası çıkar.",
            prompt: "Bir hedefe ulaşmak için adım adım uygulanabilir bir strateji ve yol haritası oluştur."
          }
        ]
      },
      en: {
        subtitle: "Chat, Actions & Knowledge Assistant",
        newChat: "New Chat",
        welcome: "Hi! I'm VYN AI. You can chat with me, get things done, or ask about anything you're curious about.",
        placeholder: "Ask VYN AI anything...",
        thinking: "Thinking...",
        error: "Could not get a response.",
        netErr: "Network error occurred.",
        copy: "Copy",
        copied: "Copied!",
        cards: [
          {
            title: "Open Chat",
            desc: "How's your day going? Share an idea.",
            prompt: "Hey VYN AI! I want to share an idea with you and brainstorm together."
          },
          {
            title: "Quick Explain",
            desc: "Break down a topic simply and clearly.",
            prompt: "Can you explain how artificial intelligence works in simple terms with clear examples?"
          },
          {
            title: "Strategy & Plan",
            desc: "Build a clear strategy and roadmap for a goal.",
            prompt: "Create a step-by-step practical strategy and roadmap to achieve a goal."
          }
        ]
      },
      fr: {
        subtitle: "Assistant de Chat, d'Actions & d'Informations",
        newChat: "Nouveau Chat",
        welcome: "Salut ! Je suis VYN AI. Tu peux discuter avec moi, effectuer des tâches ou me poser toutes tes questions.",
        placeholder: "Demande n'importe quoi à VYN AI...",
        thinking: "Réflexion en cours...",
        error: "Impossible d'obtenir une réponse.",
        netErr: "Erreur de connexion.",
        copy: "Copier",
        copied: "Copié !",
        cards: [
          {
            title: "Discussion Libre",
            desc: "Comment ça va ? Partage une idée.",
            prompt: "Salut VYN AI ! J'aimerais partager une idée avec toi et en discuter."
          },
          {
            title: "Explication Rapide",
            desc: "Explique un sujet simplement et clairement.",
            prompt: "Peux-tu m'expliquer simplement comment fonctionne l'intelligence artificielle avec des exemples ?"
          },
          {
            title: "Stratégie & Plan",
            desc: "Établis une stratégie claire et une feuille de route.",
            prompt: "Élabore une stratégie concrète étape par étape et une feuille de route pour atteindre un objectif."
          }
        ]
      },
      es: {
        subtitle: "Asistente de Chat, Acciones e Información",
        newChat: "Nuevo Chat",
        welcome: "¡Hola! Soy VYN AI. Puedes chatear conmigo, realizar acciones o preguntarme lo que quieras.",
        placeholder: "Pregúntale lo que sea a VYN AI...",
        thinking: "Pensando...",
        error: "No se pudo obtener respuesta.",
        netErr: "Ocurrió un error de conexión.",
        copy: "Copiar",
        copied: "¡Copiado!",
        cards: [
          {
            title: "Charla Libre",
            desc: "¿Cómo va tu día? Comparte una idea.",
            prompt: "¡Hola VYN AI! Quiero compartir una idea contigo y darle vueltas juntos."
          },
          {
            title: "Explicación Rápida",
            desc: "Explica un tema de forma simple y clara.",
            prompt: "¿Puedes explicarme de forma sencilla cómo funciona la inteligencia artificial con ejemplos?"
          },
          {
            title: "Estrategia y Plan",
            desc: "Crea una estrategia clara y una hoja de ruta.",
            prompt: "Crea una estrategia práctica paso a paso y una hoja de ruta para lograr un objetivo."
          }
        ]
      }
    };

    function updateStarterCardsUI() {
      const ui = langUI[currentLang] || langUI.tr;
      ui.cards.forEach((card, idx) => {
        const titleEl = document.getElementById('cardTitle' + idx);
        const descEl = document.getElementById('cardDesc' + idx);
        if (titleEl) titleEl.textContent = card.title;
        if (descEl) descEl.textContent = card.desc;
      });
    }

    function useStarter(index) {
      const ui = langUI[currentLang] || langUI.tr;
      const card = ui.cards[index];
      if (!card) return;
      inp.value = card.prompt;
      autoResize(inp);
      inp.focus();
    }

    function refreshCopyButtons() {
      const ui = langUI[currentLang] || langUI.tr;
      document.querySelectorAll('.copy-btn').forEach(btn => {
        if (!btn.classList.contains('copied')) {
          btn.textContent = ui.copy;
        }
      });
    }

    function renderWelcomeBubble() {
      const ui = langUI[currentLang] || langUI.tr;
      chat.innerHTML = '';
      const d = document.createElement('div');
      d.id = 'welcomeMsg';
      d.className = 'msg ai';

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      textDiv.textContent = ui.welcome;
      d.appendChild(textDiv);

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = ui.copy;
      copyBtn.onclick = function () { copyBubbleText(this); };
      d.appendChild(copyBtn);

      chat.appendChild(d);
    }

    function resetChat() {
      chatHistory.length = 0;
      inp.value = '';
      inp.style.height = 'auto';
      renderWelcomeBubble();
    }

    function setLang(lang) {
      currentLang = lang;
      const ui = langUI[lang] || langUI.tr;

      langButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      headerSub.textContent = ui.subtitle;
      newChatBtn.textContent = ui.newChat;
      inp.placeholder = ui.placeholder;

      const welcomeText = document.querySelector('#welcomeMsg .msg-text');
      if (welcomeText) {
        welcomeText.textContent = ui.welcome;
      }
      updateStarterCardsUI();
      refreshCopyButtons();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    }

    async function copyBubbleText(btn) {
      const ui = langUI[currentLang] || langUI.tr;
      const bubble = btn.closest('.msg');
      const textEl = bubble ? bubble.querySelector('.msg-text') : null;
      const text = textEl ? textEl.textContent : '';
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = ui.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = (langUI[currentLang] || langUI.tr).copy;
        }, 1500);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        btn.textContent = ui.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = (langUI[currentLang] || langUI.tr).copy;
        }, 1500);
      }
    }

    function addBubble(text, cls, withCopy = false) {
      const ui = langUI[currentLang] || langUI.tr;
      const d = document.createElement('div');
      d.className = 'msg ' + cls;

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      textDiv.textContent = text;
      d.appendChild(textDiv);

      if (withCopy) {
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = ui.copy;
        copyBtn.onclick = function () { copyBubbleText(this); };
        d.appendChild(copyBtn);
      }

      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return textDiv;
    }

    async function sendMsg() {
      const q = inp.value.trim();
      if (!q) return;

      const ui = langUI[currentLang] || langUI.tr;

      addBubble(q, 'user', false);
      chatHistory.push({ role: 'user', text: q });
      inp.value = '';
      inp.style.height = 'auto';

      const waitText = addBubble(ui.thinking, 'ai', true);

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: q,
            history: chatHistory,
            lang: currentLang
          })
        });
        const data = await r.json();

        if (r.ok && data.reply) {
          waitText.textContent = data.reply;
          chatHistory.push({ role: 'assistant', text: data.reply });
        } else {
          waitText.textContent = data.error || ui.error;
          chatHistory.pop();
        }
      } catch {
        waitText.textContent = ui.netErr;
        chatHistory.pop();
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
