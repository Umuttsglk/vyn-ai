<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYN AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23091021'/%3E%3Cpath d='M12 20 L24 46 L36 22 L46 38 L54 18' fill='none' stroke='url(%23g)' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 18 L26 36 L34 20' fill='none' stroke='%2338bdf8' stroke-width='3.5' stroke-linecap="round" stroke-linejoin="round' opacity='0.8'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.22), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.16), transparent 45%),
        linear-gradient(160deg, #070b14 0%, #0f172a 55%, #091021 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-right: 4px;
    }
    .brand-logo {
      display: block;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
    }
    .lang-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .lang-label {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
      padding-left: 4px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .lang-btn:hover {
      color: #ffffff;
      background: rgba(148, 163, 184, 0.14);
    }
    .lang-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .header-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 80%;
      line-height: 1.5;
      user-select: text;
      -webkit-user-select: text;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .user {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }
    .ai {
      background: rgba(30, 41, 59, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .copy-btn {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .copy-btn:hover {
      color: #ffffff;
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
    }
    .copy-btn.copied {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.65);
    }

    /* Modern Gemini Tarzı Alt Yazı Barı */
    #bar-wrap {
      padding: 10px 16px 20px;
      display: flex;
      justify-content: center;
      background: linear-gradient(to top, rgba(7, 11, 20, 0.92) 60%, transparent);
    }
    #bar {
      width: 100%;
      max-width: 780px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 26px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #bar:focus-within {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 10px 32px rgba(56, 189, 248, 0.14);
    }
    #inp {
      flex: 1;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 1rem;
      line-height: 1.45;
      max-height: 140px;
      min-height: 26px;
      padding: 6px 0;
      resize: none;
      outline: none;
      overflow-y: auto;
    }
    #inp::placeholder {
      color: #94a3b8;
    }
    #sendBtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    #sendBtn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.45);
    }
    #sendBtn:active {
      transform: scale(0.95);
    }
    #sendBtn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand-wrap">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#091021" stroke="rgba(56,189,248,0.35)" stroke-width="2"/>
          <path d="M12 20 L24 46 L36 22 L46 38 L54 18" fill="none" stroke="#a855f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 20 L24 46 L36 22" fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 18 L26 36 L34 20" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        </svg>
        <span>VYN AI</span>
      </div>

      <div class="lang-box" role="group" aria-label="Language">
        <span class="lang-label">Language:</span>
        <button type="button" class="lang-btn active" data-lang="tr" onclick="setLang('tr')">Türkçe</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
        <button type="button" class="lang-btn" data-lang="fr" onclick="setLang('fr')">Français</button>
        <button type="button" class="lang-btn" data-lang="es" onclick="setLang('es')">Español</button>
      </div>
    </div>

    <div id="headerSub" class="header-sub">Sohbet, İşlem & Bilgi Asistanı</div>
  </header>

  <div id="chat">
    <div id="welcomeMsg" class="msg ai">
      <div class="msg-text">Selam! Ben VYN AI. Sohbet edebilir, işlem yaptırabilir veya merak ettiğin konuları sorabilirsin.</div>
      <button type="button" class="copy-btn" onclick="copyBubbleText(this)">Kopyala</button>
    </div>
  </div>

  <div id="bar-wrap">
    <div id="bar">
      <textarea id="inp" rows="1" placeholder="VYN AI'a bir şey sor..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" type="button" onclick="sendMsg()" title="Gönder" aria-label="Gönder">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    const headerSub = document.getElementById('headerSub');
    const welcomeText = document.querySelector('#welcomeMsg .msg-text');
    const langButtons = document.querySelectorAll('.lang-btn');
    const chatHistory = [];
    let currentLang = 'tr';

    const langUI = {
      tr: {
        subtitle: "Sohbet, İşlem & Bilgi Asistanı",
        welcome: "Selam! Ben VYN AI. Sohbet edebilir, işlem yaptırabilir veya merak ettiğin konuları sorabilirsin.",
        placeholder: "VYN AI'a bir şey sor...",
        thinking: "Düşünüyorum...",
        error: "Cevap alınamadı.",
        netErr: "Bağlantı hatası oldu.",
        copy: "Kopyala",
        copied: "Kopyalandı!"
      },
      en: {
        subtitle: "Chat, Actions & Knowledge Assistant",
        welcome: "Hi! I'm VYN AI. You can chat with me, get things done, or ask about anything you're curious about.",
        placeholder: "Ask VYN AI anything...",
        thinking: "Thinking...",
        error: "Could not get a response.",
        netErr: "Network error occurred.",
        copy: "Copy",
        copied: "Copied!"
      },
      fr: {
        subtitle: "Assistant de Chat, d'Actions & d'Informations",
        welcome: "Salut ! Je suis VYN AI. Tu peux discuter avec moi, effectuer des tâches ou me poser toutes tes questions.",
        placeholder: "Demande n'importe quoi à VYN AI...",
        thinking: "Réflexion en cours...",
        error: "Impossible d'obtenir une réponse.",
        netErr: "Erreur de connexion.",
        copy: "Copier",
        copied: "Copié !"
      },
      es: {
        subtitle: "Asistente de Chat, Acciones e Información",
        welcome: "¡Hola! Soy VYN AI. Puedes chatear conmigo, realizar acciones o preguntarme lo que quieras.",
        placeholder: "Pregúntale lo que sea a VYN AI...",
        thinking: "Pensando...",
        error: "No se pudo obtener respuesta.",
        netErr: "Ocurrió un error de conexión.",
        copy: "Copiar",
        copied: "¡Copiado!"
      }
    };

    function refreshCopyButtons() {
      const ui = langUI[currentLang] || langUI.tr;
      document.querySelectorAll('.copy-btn').forEach(btn => {
        if (!btn.classList.contains('copied')) {
          btn.textContent = ui.copy;
        }
      });
    }

    function setLang(lang) {
      currentLang = lang;
      const ui = langUI[lang] || langUI.tr;

      langButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      headerSub.textContent = ui.subtitle;
      welcomeText.textContent = ui.welcome;
      inp.placeholder = ui.placeholder;
      refreshCopyButtons();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    }

    async function copyBubbleText(btn) {
      const ui = langUI[currentLang] || langUI.tr;
      const bubble = btn.closest('.msg');
      const textEl = bubble ? bubble.querySelector('.msg-text') : null;
      const text = textEl ? textEl.textContent : '';
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = ui.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = (langUI[currentLang] || langUI.tr).copy;
        }, 1500);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        btn.textContent = ui.copied;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = (langUI[currentLang] || langUI.tr).copy;
        }, 1500);
      }
    }

    function addBubble(text, cls, withCopy = false) {
      const ui = langUI[currentLang] || langUI.tr;
      const d = document.createElement('div');
      d.className = 'msg ' + cls;

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      textDiv.textContent = text;
      d.appendChild(textDiv);

      if (withCopy) {
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = ui.copy;
        copyBtn.onclick = function () { copyBubbleText(this); };
        d.appendChild(copyBtn);
      }

      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return textDiv;
    }

    async function sendMsg() {
      const q = inp.value.trim();
      if (!q) return;

      const ui = langUI[currentLang] || langUI.tr;

      addBubble(q, 'user', false);
      chatHistory.push({ role: 'user', text: q });
      inp.value = '';
      inp.style.height = 'auto';

      const waitText = addBubble(ui.thinking, 'ai', true);

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: q,
            history: chatHistory,
            lang: currentLang
          })
        });
        const data = await r.json();

        if (r.ok && data.reply) {
          waitText.textContent = data.reply;
          chatHistory.push({ role: 'assistant', text: data.reply });
        } else {
          waitText.textContent = data.error || ui.error;
          chatHistory.pop();
        }
      } catch {
        waitText.textContent = ui.netErr;
        chatHistory.pop();
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
