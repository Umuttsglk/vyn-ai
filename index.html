<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYN AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.22), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.16), transparent 45%),
        linear-gradient(160deg, #070b14 0%, #0f172a 55%, #091021 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #38bdf8;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .msg { padding: 12px 14px; border-radius: 12px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
    .user {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      align-self: flex-end;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }
    .ai {
      background: rgba(30, 41, 59, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      align-self: flex-start;
    }
    #bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      padding: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    #bar input {
      width: 100%;
      max-width: 650px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      outline: none;
    }
    #bar input:focus { border-color: #38bdf8; }
    #bar button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>VYN AI — Sohbet, İşlem & Bilgi Asistanı</header>
  <div id="chat">
    <div class="msg ai">Selam! Ben VYN AI. Sohbet edebilir, işlem yaptırabilir veya merak ettiğin konuları sorabilirsin.</div>
  </div>
  <div id="bar">
    <input id="inp" type="text" placeholder="VYN AI'a yaz..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Gönder</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    const chatHistory = [];

    function addBubble(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    async function sendMsg() {
      const q = inp.value.trim();
      if (!q) return;

      addBubble(q, 'user');
      chatHistory.push({ role: 'user', text: q });
      inp.value = '';

      const wait = addBubble('Düşünüyorum...', 'ai');

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: q,
            history: chatHistory
          })
        });
        const data = await r.json();

        if (r.ok && data.reply) {
          wait.textContent = data.reply;
          chatHistory.push({ role: 'assistant', text: data.reply });
        } else {
          wait.textContent = data.error || 'Cevap alınamadı.';
          chatHistory.pop();
        }
      } catch {
        wait.textContent = 'Bağlantı hatası oldu.';
        chatHistory.pop();
      }
    }
  </script>
</body>
</html>
